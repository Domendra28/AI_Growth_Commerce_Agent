version: '3.8'

services:
  commerce-agent:
    build: .
    container_name: ai_growth_agentic_commerce
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-mock_key}
      - GOOGLE_GENAI_MODEL=${GOOGLE_GENAI_MODEL:-gemini-2.5-flash}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-mock}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_mock123}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-mock_secret_456}
      - RAZORPAY_MODE=test
      - MAX_TRANSACTION_AMOUNT=10000
    stdin_open: true
    tty: true
